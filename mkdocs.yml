site_name: Cuadratura Gaussiana

theme:
  name: "material"

plugins:
  - mkdocstrings

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Problema: index.md
  - Explicación: explanation.md
  - Tutorial: tutorials.md
  - Referencia: reference.md

